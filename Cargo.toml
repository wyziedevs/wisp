[workspace]
resolver = "3"
members = [
    "crates/wisp",
    "crates/wisp-build",
    "crates/wisp-macros",
    "crates/wisp-shared",
    "crates/wisp-cli",
    "examples/demo",
    "examples/api",
    "examples/jobs",
    "examples/img",
    "tests/app",
    "tests/agents",
    "tests/islands",
    "tests/platform",
    "bench/load",
    "bench/run",
    "bench/app",
    "bench/tokens",
    "bench/tokens/apps/wisp",
    "bench/tokens/real/wisp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/wyziedevs/wisp"

[workspace.dependencies]
wisp = { path = "crates/wisp", version = "0.1.0" }
wisp-build = { path = "crates/wisp-build", version = "0.1.0" }
wisp-macros = { path = "crates/wisp-macros", version = "0.1.0" }
wisp-shared = { path = "crates/wisp-shared", version = "0.1.0" }
httparse = { version = "1.10", default-features = false, features = ["std"] }
tokio = { version = "1.53", default-features = false, features = ["rt", "net", "io-util", "time", "signal", "sync", "fs"] }

# No `unsafe` anywhere in Wisp or in apps' generated code. (bench/run, a
# benchmark tool that calls the OS to pin processes to CPUs, sets its own.)
[workspace.lints.rust]
unsafe_code = "forbid"

# Dev builds near release speed: at opt-level 0 a template page ran 3-5x
# slower (0.3 ms for the demo's Wisple) and a route edit rebuilt no faster.
# With line tables only, light optimization costs the debugger nothing.
[profile.dev]
debug = "line-tables-only"
opt-level = 1

[profile.release]
codegen-units = 1
lto = "fat"
