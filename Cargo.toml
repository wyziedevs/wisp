[workspace]
resolver = "3"
members = [
    "crates/wisp",
    "crates/wisp-build",
    "crates/wisp-macros",
    "crates/wisp-cli",
    "examples/demo",
    "examples/api",
    "tests/app",
    "bench/load",
    "bench/run",
    "bench/app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/wyziedevs/wisp"

[workspace.dependencies]
wisp = { path = "crates/wisp" }
wisp-build = { path = "crates/wisp-build" }
wisp-macros = { path = "crates/wisp-macros" }
httparse = { version = "1.10", default-features = false, features = ["std"] }
tokio = { version = "1.53", default-features = false, features = ["rt", "net", "io-util", "time", "signal", "sync", "fs"] }

# No `unsafe` anywhere in Wisp or in apps' generated code. (bench/run, a
# benchmark tool that calls the OS to pin processes to CPUs, sets its own.)
[workspace.lints.rust]
unsafe_code = "forbid"

# Fast rebuilds: the app crate stays unoptimized, dependencies are compiled
# once with light optimization so the dev server is not painfully slow.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

[profile.release]
codegen-units = 1
lto = "fat"
