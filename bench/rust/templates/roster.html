{% extends "layout.html" %}
{% block title %}Roster{% endblock %}
{% block content %}
<h1>Roster</h1>
<table>
<thead><tr><th>id</th><th>name</th><th>score</th></tr></thead>
<tbody>
{% for p in people %}
<tr class="{% if p.active %}on{% else %}off{% endif %}"><td>{{ p.id }}</td><td>{{ p.name }}</td><td>{{ p.score }}</td></tr>
{% endfor %}
</tbody>
</table>
<form method="post" action="/subscribe"><label>Email <input type="email" name="email" required></label><button>Subscribe</button></form>
{% endblock %}
