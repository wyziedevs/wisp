# Actix Web and Axum, the Rust side of bench/. A workspace of its own so
# their dependencies stay out of Wisp's Cargo.lock.
[package]
name = "bench-rust"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "bench-rust"
path = "main.rs"

[dependencies]
actix-web = "4"
askama = "0.16"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
# The TechEmpower top tier, pinned.
bytes = "1"
http-body-util = "=0.1.5"
hyper = { version = "=1.11.1", features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
may = "=0.3.51"
may_minihttp = "=0.1.11"
ntex = { version = "=3.12.3", features = ["neon"] }
serde_json = "1"
xitca-web = { version = "=0.8.3", features = ["json"] }

[workspace]

# Same release profile as the Wisp workspace.
[profile.release]
codegen-units = 1
lto = "fat"
