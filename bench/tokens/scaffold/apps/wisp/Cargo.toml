# What `wisp new` writes (crates/wisp-cli/src/new.rs CARGO_TOML), the wisp deps in workspace form.
[package]
name = "tokens-wisp"
version = "0.1.0"
edition = "2024"

[dependencies]
wisp = { workspace = true }

[build-dependencies]
wisp-build = { workspace = true }

# `cargo test --features browser` runs the tests in a headless Chrome or Edge.
[features]
browser = ["wisp/browser"]

# Dev builds near release speed, and rebuilds as fast as unoptimized ones
# (`lto = "off"` skips the local ThinLTO pass opt-level 1 runs on every edit).
[profile.dev]
debug = "line-tables-only"
opt-level = 1
lto = "off"

[profile.release]
codegen-units = 1
lto = "fat"
