[package]
name = "i18n"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
wisp.workspace = true

[dev-dependencies]
tokio.workspace = true

[build-dependencies]
wisp-build.workspace = true

# How locales show in URLs and what a missing message does (see
# the design page, Translations): English has no prefix, the others do
# (`/fr/about`), and a locale that lacks a message gets English's, with a
# build warning, instead of a build error.
[package.metadata.wisp]
i18n = ["default en", "prefix as-needed", "missing warn"]
