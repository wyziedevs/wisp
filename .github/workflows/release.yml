# Release binaries of the `wisp` command. Runs only on a pushed tag `v*`
# (see RELEASING.md); nothing here runs on a branch push.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, musl: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, musl: true }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked -p wisp-web --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name=wisp-${{ matrix.target }}
          mkdir "$name"
          cp LICENSE README.md "$name/"
          if [ "${{ runner.os }}" = Windows ]; then
            cp target/${{ matrix.target }}/release/wisp.exe "$name/"
            7z a "$name.zip" "$name" >/dev/null
            file="$name.zip"
          else
            cp target/${{ matrix.target }}/release/wisp "$name/"
            tar czf "$name.tar.gz" "$name"
            file="$name.tar.gz"
          fi
          if command -v sha256sum >/dev/null; then sha256sum "$file" > "$file.sha256"; else shasum -a 256 "$file" > "$file.sha256"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wisp-${{ matrix.target }}
          path: wisp-${{ matrix.target }}.*
  release:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && cat *.sha256 > SHA256SUMS
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --title "$TAG" --notes "Wisp $TAG"
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber dist/*
