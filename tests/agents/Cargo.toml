# Every Rust and HTML snippet of AGENTS.md, as written, in an app: building
# the workspace compiles them, and `tests/snippets.rs` checks each is here.
[package]
name = "wisp-agents-snippets"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
wisp.workspace = true

[build-dependencies]
wisp-build.workspace = true

[lints]
workspace = true
