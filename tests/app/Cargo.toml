# An app that uses every part of Wisp a demo would not: hooks, uploads,
# signed cookies, streamed responses, body limits, browser code.
# `tests/http.rs` runs it as a server, `tests/client.rs` in process.
[package]
name = "wisp-test-app"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
wisp.workspace = true

# The app itself uses `wisp::spawn` and `wisp::sleep`, which work in the edge
# build too (`wisp build --target cloudflare`); only the tests use tokio.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio.workspace = true

[build-dependencies]
wisp-build.workspace = true

[lints]
workspace = true

[features]
# `tests/tower.rs`: the app as a tower service.
tower = ["wisp/tower"]
