[package]
name = "wisp"
description = "A fast, fun web framework for Rust: file-based routes, .wisp templates, form actions, one binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
httparse.workspace = true
wisp-macros.workspace = true
# The `tower` feature: `wisp::tower`, for axum, hyper, tower middleware and
# AWS Lambda. Off by default.
bytes = { version = "1", optional = true }
http = { version = "1", optional = true }
http-body = { version = "1", optional = true }
tower-service = { version = "0.3", optional = true }

# The edge build (`wisp build --target cloudflare` and the like) runs in a
# JavaScript host's WebAssembly: no sockets, files, signals or threads.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio.workspace = true
[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.53", default-features = false, features = ["sync"] }
# io_uring on Linux (`src/uring.rs`); tokio depends on it already.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# Minifies the browser runtime for release builds (build.rs).
[build-dependencies]
wisp-build.workspace = true

[features]
tower = ["dep:bytes", "dep:http", "dep:http-body", "dep:tower-service"]

# The workspace's `forbid(unsafe_code)`, loosened to `deny` for two modules:
# the edge build's exports and imports (`src/edge.rs`, wasm32 only), which
# Rust spells `unsafe`, and the Linux server's io_uring (`src/uring.rs`).
# `lib.rs` still forbids it in every other native build.
[lints.rust]
unsafe_code = "deny"

