[package]
name = "wisp"
description = "A fast, fun web framework for Rust: file-based routes, .wisp templates, form actions, one binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
httparse.workspace = true
wisp-macros.workspace = true
# The HTML context rules, the live-page wire protocol and the browser
# runtime, which wisp-build builds against too.
wisp-shared.workspace = true
# The `tower` feature: `wisp::tower`, for axum, hyper, tower middleware and
# AWS Lambda. Off by default.
bytes = { version = "1", optional = true }
http = { version = "1", optional = true }
http-body = { version = "1", optional = true }
tower-service = { version = "0.3", optional = true }

# The edge build (`wisp build --target cloudflare` and the like) runs in a
# JavaScript host's WebAssembly: no sockets, files, signals or threads.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio.workspace = true
# The `tls` feature: `https://` for `wisp::fetch` (and so OAuth).
# Off by default; the web's root certificates, no OpenSSL.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
webpki-roots = { version = "1", optional = true }
[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.53", default-features = false, features = ["sync"] }
# io_uring and epoll on Linux (`src/uring.rs`, `src/epoll.rs`); tokio
# depends on it already.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# Counts the allocations of the test thread (it replaces the allocator of
# Wisp's own test binaries only): a warm request must make none.
[dev-dependencies]
allocation-counter = "0.8"

# Minifies the browser runtime for release builds (build.rs).
[build-dependencies]
wisp-build.workspace = true
wisp-shared.workspace = true

[features]
tls = ["dep:tokio-rustls", "dep:webpki-roots"]
tower = ["dep:bytes", "dep:http", "dep:http-body", "dep:tower-service"]
# `wisp::test::browser`: tests in a headless Chrome or Edge. No deps.
browser = []
# `wisp check --types`: the app's binary prints the TypeScript of the server
# values its scripts read (`src/ts.rs`) and exits. Never in a served build.
types = []

# The workspace's `forbid(unsafe_code)`, loosened to `deny` for three
# modules: the edge build's exports and imports (`src/edge.rs`, wasm32
# only), which Rust spells `unsafe`, and the Linux server's io_uring and
# epoll (`src/uring.rs`, `src/epoll.rs`).
# `lib.rs` still forbids it in every other native build.
[lints.rust]
unsafe_code = "deny"

