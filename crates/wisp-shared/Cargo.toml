[package]
name = "wisp-web-shared"
description = "What Wisp's runtime, compiler and browser code agree on: HTML context rules, the live-page wire protocol, the browser runtime."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["web", "framework", "html", "escaping"]
categories = ["web-programming"]
# Tests stay in the repository: the published crate is what builds.
exclude = ["tests/**"]

# Published as `wisp-web-shared`; code still says `wisp_shared::`.
[lib]
name = "wisp_shared"
path = "src/lib.rs"

[lints]
workspace = true

[features]
# `wisp::og(.., "auto")` names PNG pictures, not SVG (`wisp build` renders them with the cli's `og-png`).
og-png = []
